name: AI autopost test

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish a new post now'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One worker pass (news + images)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SECONDS: '5'
        run: python3 tool/ai_worker.py
      - name: Status / force
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://smjkxsqvdpywumghvnfv.supabase.co/rest/v1/rpc/ai_autopost_gh",
              data=json.dumps({"p_gh": os.environ["GH_TOKEN"], "p_force": os.environ.get("FORCE") == "true"}).encode(),
              headers={"apikey": "sb_publishable_xqWRKqnOIKKqKgPJrdP5TA_GA7PCSiV", "Content-Type": "application/json"}, method="POST")
          out = json.dumps(json.loads(urllib.request.urlopen(req, timeout=60).read()), ensure_ascii=False, indent=1)
          print(out)
          open("/tmp/ai_status.json", "w").write(out)
          PY
      - name: Save status
        if: always()
        run: |
          mkdir -p /tmp/o && cp /tmp/ai_status.json /tmp/o/ 2>/dev/null || echo '{}' > /tmp/o/ai_status.json
          cd /tmp/o && git init -q -b r && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm status && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" r:ci-ai || true
