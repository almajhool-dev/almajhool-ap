name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > release.jks; echo "STOREFILE=release.jks" >> $GITHUB_ENV; fi
      - name: Build release APK
        env:
          STOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: ./gradlew assembleRelease testReleaseUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SkyMonitorIraq-apk
          path: app/build/outputs/apk/release/*.apk
