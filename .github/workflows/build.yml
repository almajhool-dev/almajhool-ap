name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tool/signal-test/**'
      - '.github/workflows/diagnostics.yml'
      - '**.md'
      - 'admin/**'
      - '.github/workflows/push-refresh.yml'
      - 'tool/push_refresh.py'
      - 'supabase/**'
      - 'tool/rotation-test/**'
      - '.github/workflows/rotation-test.yml'
      - 'release/**'
      - '.github/workflows/release-control.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK, release APK and AAB
        id: build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash tool/ci_build.sh 2>&1 | tee ci.log

      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: almajhool-app-${{ github.run_number }}
          path: dist/*

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: المبرمج المجهول v1.0.${{ github.run_number }}
          make_latest: false
          body: |
            ## تحميل التطبيق
            - **almajhool-app.apk** ← للتثبيت على أي هاتف أندرويد (6 فما فوق، 32 و 64 بت)
            - almajhool-arm64.apk ← نسخة أصغر لأغلب الهواتف الحديثة
            - almajhool-armv7.apk ← نسخة أصغر للهواتف القديمة (32 بت)
            - almajhool-app.aab ← للنشر على Google Play
          files: |
            dist/almajhool-app.aab

      - name: Publish universal APK (last, for older in-app updaters)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          make_latest: false
          files: dist/almajhool-app.apk

      - name: Announce release to the app server
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          URL="https://github.com/${{ github.repository }}/releases/download/v1.0.$N/almajhool-app.apk"
          python3 - "$N" "$URL" <<'PY'
          import json, os, sys, urllib.request
          n, url = int(sys.argv[1]), sys.argv[2]
          req = urllib.request.Request('https://smjkxsqvdpywumghvnfv.supabase.co/rest/v1/rpc/ci_set_release',
              data=json.dumps({'p_gh': os.environ['GH_TOKEN'], 'p_build': n, 'p_url': url, 'p_notes': ''}).encode(),
              headers={'apikey': 'sb_publishable_xqWRKqnOIKKqKgPJrdP5TA_GA7PCSiV', 'Content-Type': 'application/json'})
          print(urllib.request.urlopen(req, timeout=30).read().decode())
          PY

      - name: Save build log
        if: always()
        run: |
          [ -f ci.log ] || echo "no log" > ci.log
          STATUS="${{ steps.build.outcome }}"
          mkdir -p /tmp/logs
          tail -n 400 ci.log > /tmp/logs/last.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=$STATUS" > /tmp/logs/status.txt
          grep -nE "error|Error|ERROR|FAILURE|Exception" ci.log | head -n 200 > /tmp/logs/errors.log || true
          M=build/app/outputs/mapping/release/mapping.txt
          [ -f "$M" ] && gzip -c "$M" > /tmp/logs/mapping-${{ github.run_number }}.txt.gz || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "log run ${{ github.run_number }}: $STATUS"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
