name: Build iPhone (IPA)

# نسخة الآيفون: ملف VYFRI.ipa (بدون توقيع) ينتشر بإصدار «ios-latest» على GitHub.
# التثبيت على الآيفون مجانًا عن طريق Sideloadly أو AltStore بحساب Apple ID عادي.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'ios/**', 'pubspec.yaml', 'assets/**', '.github/workflows/ios.yml']

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry VYFRI.ipa Payload
          ls -lh VYFRI.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest VYFRI.ipa --title "VYFRI للآيفون (1.0.${{ github.run_number }})" --notes "ملف تطبيق VYFRI للآيفون. ثبّته مجانًا بـ Sideloadly أو AltStore بحساب Apple ID عادي (يتجدد كل 7 أيام)." --latest=false
