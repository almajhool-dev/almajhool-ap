name: Build iPhone (IPA)

# نسخة الآيفون: ملف VYFRI.ipa (بدون توقيع) ينتشر بإصدار «ios-latest» على GitHub.
# التثبيت على الآيفون مجانًا عن طريق Sideloadly أو AltStore بحساب Apple ID عادي.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'ios/**', 'pubspec.yaml', 'assets/**', '.github/workflows/ios.yml']

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        id: build
        run: |
          set -o pipefail
          # CocoaPods بدل Swift Package Manager (تعارض نسخ Firebase و Google Sign-In بالـ SPM)
          flutter config --no-enable-swift-package-manager
          flutter pub get 2>&1 | tee ios.log
          flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee -a ios.log

      # سجل البناء بفرع ci-logs-ios (مثل أندرويد) حتى نعرف سبب أي فشل — بعد شيل أي سر من السجل
      - name: Save build log
        if: always()
        run: |
          [ -f ios.log ] || echo "no log" > ios.log
          sed -E -i.bak 's/::add-mask::.*/::add-mask::***/; s/((store|key)?[Pp]ass(word)?|[Ss]ecret|[Tt]oken)([=:][[:space:]]*)[^[:space:]]+/\1\4***/g' ios.log && rm -f ios.log.bak
          mkdir -p /tmp/ilogs
          tail -n 300 ios.log > /tmp/ilogs/last.log
          grep -nE "error|Error|ERROR|FAILED|Failed|Exception" ios.log | head -n 150 > /tmp/ilogs/errors.log || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ steps.build.outcome }}" > /tmp/ilogs/status.txt
          cd /tmp/ilogs
          git init -q -b ci-logs-ios
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "ios log run ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-ios
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry VYFRI.ipa Payload
          ls -lh VYFRI.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest VYFRI.ipa --title "VYFRI للآيفون (1.0.${{ github.run_number }})" --notes "ملف تطبيق VYFRI للآيفون. ثبّته مجانًا بـ Sideloadly أو AltStore بحساب Apple ID عادي (يتجدد كل 7 أيام)." --latest=false
