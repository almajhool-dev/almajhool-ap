name: Release control

# يتحكم بظهور التحديث للمستخدمين:
#  paused=true  → ما يطلع أي تحديث (حتى النسخ القديمة)
#  paused=false + latest_tag=v1.0.N → يطلع تحديث النسخة N للكل
on:
  push:
    branches: [main]
    paths: ['release/control.json']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        env:
          GH_TOKEN: ${{ github.token }}
          SB_SERVICE: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          c = json.load(open('release/control.json'))
          tok = os.environ['GH_TOKEN']
          svc = os.environ.get('SB_SERVICE', '')
          repo = os.environ['GITHUB_REPOSITORY']
          def gh(method, path, body=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json'})
              return json.loads(urllib.request.urlopen(req, timeout=30).read() or 'null')
          # make_latest على GitHub (نتجاهل الخطأ إذا المستودع صار خاص أو الإصدار مو موجود)
          try:
              rel = gh('GET', '/releases/tags/' + c['latest_tag'])
              print('latest ->', rel['tag_name'], gh('PATCH', '/releases/%d' % rel['id'], {'make_latest': 'true'})['tag_name'])
          except Exception as e:
              print('make_latest skipped:', e)
          sb = 'https://smjkxsqvdpywumghvnfv.supabase.co/rest/v1/rpc/'
          hdr = {'apikey': 'sb_publishable_xqWRKqnOIKKqKgPJrdP5TA_GA7PCSiV', 'Content-Type': 'application/json'}
          if not c['paused']:
              n = int(c['latest_tag'].split('.')[-1])
              # لو مفتاح الخدمة مضاف: التحديث ينزل من تخزين Supabase (يشتغل حتى لو المستودع خاص)
              if svc:
                  url = 'https://smjkxsqvdpywumghvnfv.supabase.co/storage/v1/object/public/releases/%s/almajhool-app.apk' % c['latest_tag']
              else:
                  url = 'https://github.com/%s/releases/download/%s/almajhool-app.apk' % (repo, c['latest_tag'])
              # البصمة الرقمية (SHA-256) لنفس الملف بالضبط: التطبيق يرفض أي ملف ما يطابقها
              sha = None
              try:
                  h = hashlib.sha256()
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'vyfri-ci'}), timeout=300) as f:
                      while True:
                          b = f.read(1 << 20)
                          if not b:
                              break
                          h.update(b)
                  sha = h.hexdigest()
              except Exception as e:
                  print('sha256 skipped:', e)
              body = {'p_gh': tok, 'p_build': n, 'p_url': url, 'p_notes': ''}
              if sha:
                  body['p_sha256'] = sha
              try:
                  r = urllib.request.Request(sb + 'ci_set_release', data=json.dumps(body).encode(), headers=hdr)
                  print('set', url, sha, urllib.request.urlopen(r, timeout=30).read().decode())
              except urllib.error.HTTPError as e:
                  if 'p_sha256' not in body:
                      raise
                  print('5-arg set failed (%s) -> retry without fingerprint' % e.code)
                  body.pop('p_sha256')
                  r = urllib.request.Request(sb + 'ci_set_release', data=json.dumps(body).encode(), headers=hdr)
                  print('set', url, urllib.request.urlopen(r, timeout=30).read().decode())
          r = urllib.request.Request(sb + 'ci_release_pause', data=json.dumps({'p_gh': tok, 'p_paused': bool(c['paused'])}).encode(), headers=hdr)
          print('pause', urllib.request.urlopen(r, timeout=30).read().decode())
          PY
