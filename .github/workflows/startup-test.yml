name: Startup test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool/startup-test/**'
      - '.github/workflows/startup-test.yml'
      - 'tool/patch_android.py'
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [main]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/checkout@v4
        with:
          path: _t
          sparse-checkout: tool/startup-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build x86_64 test APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          [ -f android/app/src/main/AndroidManifest.xml ] || flutter create --org com.almajhool --project-name almajhool_app --platforms android --no-pub .
          python3 tool/patch_android.py
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f $f ] && sed -i 's/"armeabi-v7a", "arm64-v8a"/"armeabi-v7a", "arm64-v8a", "x86_64"/; s/'"'"'armeabi-v7a'"'"', '"'"'arm64-v8a'"'"'/'"'"'armeabi-v7a'"'"', '"'"'arm64-v8a'"'"', '"'"'x86_64'"'"'/' $f || true
          done
          flutter pub get
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true
          flutter build apk --release --target-platform android-x64 --build-number=999 --build-name=1.0.999 --dart-define=APP_BUILD=999 \
            --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          cp build/app/outputs/flutter-apk/app-release.apk app.apk
          ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash _t/tool/startup-test/run.sh app > startup.log 2>&1; R=$?; adb exec-out screencap -p > shot.png; cat startup.log; exit $R
      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp startup.log /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/startup.log
          cp shot.png /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q -b r
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "startup test"
          B=ci-startup-$(echo "${{ matrix.ref }}" | tr '.' '-')
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "r:$B" || true
