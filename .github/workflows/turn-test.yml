name: TURN test

on:
  push:
    paths: ['tool/turn_test.py', '.github/workflows/turn-test.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  turn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test relay servers
        run: |
          U="$(( $(date +%s) + 3600 )):almajhool"
          P=$(printf '%s' "$U" | openssl dgst -binary -sha1 -hmac openrelayprojectsecret | base64)
          {
            for t in "global.relay.metered.ca 80 udp" "global.relay.metered.ca 80 tcp" "global.relay.metered.ca 443 tcp"; do
              python3 tool/turn_test.py $t b6ba53a1ce65d87ca79ec24b lee1tKAVUEX33OWG
            done
          } 2>&1 | tee turn.log
      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/t && cp turn.log /tmp/t/ 2>/dev/null || echo none > /tmp/t/turn.log
          cd /tmp/t && git init -q -b turn-logs && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "turn ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" turn-logs
